/* A bit more shade over the light colors so white text stays readable. */
.card.idle::after { background: rgba(30,26,60,0.16); }
.card.idle .news-meta { color: #f4f1f8; text-shadow: 0 1px 2px rgba(40,30,70,0.55); }
.card.idle .news-title, .card.idle .news-cat { text-shadow: 0 1px 3px rgba(40,30,70,0.55), 0 0 12px rgba(40,30,70,0.35); }
.card.idle .news-list li, .card.idle .news-head { border-color: rgba(255,255,255,0.25); }
.card.idle .art-placeholder { opacity: 0.45; }
.card::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(10,10,10,0.22); z-index: 1; pointer-events: none; }
.art-box { width: 100%; position: relative; z-index: 2; margin: 0 auto 4px; background: transparent; border: none; border-radius: 0; overflow: visible; -webkit-flex-shrink: 0; flex-shrink: 0; }

.marquee-inner.is-long span { padding-right: 60px; }
.marquee-inner.is-long .clone { display: inline; }

.progress-panel { margin-bottom: 4px; width: 100%; pointer-events: none; -webkit-flex-shrink: 0; flex-shrink: 0; }
.track-bar { width: 100%; height: 6px; background: #282828; border-radius: 4px; overflow: hidden; }
.track-fill { background: #fff; height: 100%; width: 0%; }
.time-labels { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; font-size: 1rem; font-weight: 600; color: #ddd; text-shadow: 0 1px 2px rgba(0,0,0,0.95); margin-top: 8px; font-variant-numeric: tabular-nums; }
.minimal-controls { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; margin: 10px 0; -webkit-flex-shrink: 0; flex-shrink: 0; margin-top: auto; margin-bottom: 0; }
.minimal-controls button { background: #212121; color: #aaa; border: 1px solid #333; width: 44px; height: 44px; min-width: 44px; min-height: 44px; margin: 0 2px; padding: 0; border-radius: 10px; cursor: pointer; touch-action: manipulation; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; font-size: 0.95rem; font-weight: bold; font-family: inherit; }
.minimal-controls button:active { -webkit-transform: scale(0.95); transform: scale(0.95); background: #333; }
.minimal-controls button.active { background: #3a3a3a; border-color: #555; color: #fff; }
.minimal-controls button svg { width: 20px; height: 20px; fill: currentColor; }
.minimal-controls button.active-all { background: #3a3a3a; border-color: #555; color: #fff; }
.minimal-controls button.active-one { background: #4a4a4a; border-color: #666; color: #fff; position: relative; }
.minimal-controls button.active-one::after { content: "1"; position: absolute; bottom: 2px; right: 2px; font-size: 9px; font-weight: bold; color: #fff; background: #212121; padding: 2px 4px; border-radius: 6px; }
.minimal-controls button[disabled] { opacity: 0.35; }
.minimal-controls button[disabled]:active { -webkit-transform: none; transform: none; background: #212121; }
.status-note { margin: 8px 0 0; font-size: 0.75rem; color: #999; text-shadow: 0 1px 2px rgba(0,0,0,0.95); }
.hidden { display: none !important; }
@media (max-width: 320px) and (max-height: 700px) { .card { height: -webkit-calc(100vh - 12px); height: calc(100vh - 12px); min-height: -webkit-calc(100vh - 12px); min-height: calc(100vh - 12px); max-height: -webkit-calc(100vh - 12px); max-height: calc(100vh - 12px); padding: 8px 10px; } .art-box { width: 240px; max-width: 78vw; margin-bottom: 10px; } h2.marquee-inner { font-size: 1.6rem; } .track-sub.marquee-inner { font-size: 1.1rem; } .meta-container > * { margin-top: 2px; } .meta-container { margin-bottom: 3px; } .time-labels { margin-top: 4px; font-size: 0.9rem; } .progress-panel { margin-bottom: 2px; } .minimal-controls { margin-top: auto; margin-bottom: 0; } }
/* No buttons: the card hugs its content instead of stretching, so the gap left by the
   controls isn't spread between the title, artist and progress bar. */
.card.no-controls { min-height: 0; -webkit-box-pack: start; -webkit-justify-content: flex-start; justify-content: flex-start; }
/* Music / News tabs at the top of the card. */
.view-tabs { display: -webkit-box; display: -webkit-flex; display: flex; margin: 0 0 10px; -webkit-flex-shrink: 0; flex-shrink: 0; }
.view-tabs button { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; height: 36px; margin: 0 2px; padding: 0; background: #212121; color: #aaa; border: 1px solid #333; border-radius: 10px; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.view-tabs button:active { -webkit-transform: scale(0.97); transform: scale(0.97); }
.view-tabs button.on { background: #3a3a3a; border-color: #555; color: #fff; }

.card.news-mode { height: 520px; height: -webkit-calc(100vh - 24px); height: calc(100vh - 24px); min-height: 0; -webkit-box-pack: start; -webkit-justify-content: flex-start; justify-content: flex-start; }
.card.news-mode > .art-box, .card.news-mode > .marquee-container, .card.news-mode > .meta-container, .card.news-mode > .progress-panel, .card.news-mode > .minimal-controls { display: none !important; }
.news { text-align: left; cursor: pointer; overflow: hidden; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
.news-head { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin: 2px 2px 6px; }
.news-cat { font-size: 2.1rem; line-height: 1.1; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.95); }

.news-dots span.on { background: #fff; }
.news-list { list-style: none; margin: 0; padding: 0; }
.news-list li { padding: 12px 2px; border-top: 1px solid #2a2a2a; }
.news-title { font-size: 1.5rem; font-weight: 700; line-height: 1.22; color: #f2f2f2; }
.news-meta { font-size: 0.95rem; font-weight: 600; color: #8a8a8a; margin-top: 4px; }

<body>
<div class="card idle">
  <div class="card-bg" id="card-bg"></div>
  <div class="view-tabs" id="view-tabs"><button type="button" data-view="music" class="on">Music</button><button type="button" data-view="news">News</button></div>
  <div class="art-box" id="art-container"><span class="art-placeholder">&#127925;</span></div>
  <div class="marquee-container"><h2 id="title-wrap" class="marquee-inner"><span id="title">Jellyfin</span><span class="clone" id="title-clone"></span></h2></div>
  <div class="meta-container">
    <div class="marquee-container"><div id="artist-wrap" class="track-sub marquee-inner"><span id="artist">Connecting...</span><span class="clone" id="artist-clone"></span></div></div>
    <div class="marquee-container"><div id="album-wrap" class="track-sub marquee-inner"><span id="album"></span><span class="clone" id="album-clone"></span></div></div>
  </div>
  <div class="progress-panel" id="progress-panel"><div class="track-bar"><div class="track-fill" id="track-fill"></div></div><div class="time-labels"><span id="time-elapsed">0:00</span><span id="time-duration">0:00</span></div></div>

  <div class="minimal-controls" id="minimal-controls">
    <button id="btn-shuffle" data-action="shuffle" title="Shuffle" disabled>
      <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
    </button>
    <button id="btn-prev" data-action="prev" title="Previous" disabled>
      <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
    </button>
    <button id="btn-playpause" data-action="playpause" title="Play/Pause" disabled>&#9199;</button>
    <button id="btn-next" data-action="next" title="Next" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12h2V6h-2z"/></svg>
    </button>
    <button id="btn-repeat" data-action="repeat" title="Repeat" disabled>
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v6z"/></svg>
    </button>
  </div>
  <div class="news hidden" id="news">
    <div class="news-head"><span class="news-cat" id="news-cat">News</span><span class="news-dots" id="news-dots"></span></div>
    <ul class="news-list" id="news-list"></ul>
  </div>
  <p class="status-note hidden" id="status-note"></p>
</div>

<script>
/* Plain ES5 + XMLHttpRequest so it runs on old Android browsers. */
(function () {
  var POLL_INTERVAL_MS = 1069;
  var EMPTY_ALBUM_TEXT = '(\uFF89\u25D5\u30EE\u25D5) \uFF89*:\uFF65\uFF9F\u2727';
  var REPEAT_NEXT = { RepeatNone: 'RepeatOne', RepeatOne: 'RepeatAll', RepeatAll: 'RepeatNone' };
  var NEWS_ROTATE_MS = __NEWS_ROTATE_SECONDS__ * 1000;
  var MAX_HEADLINES = 4;
  var PLAY_GLYPH = '\u25B6', PAUSE_GLYPH = '\u275A\u275A';

  var state = { playing: false };
  var baseElapsed = 0, baseTime = now(), duration = 0;
  var currentArtwork = null, songSignature = '', isSending = false, pendingUntil = 0;

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    function (cb) { return setTimeout(cb, 250); };

  function now() {
    return (window.performance && performance.now) ? performance.now() : new Date().getTime();
  }
  function $(id) { return document.getElementById(id); }
  function setText(el, text) { el.textContent = text; }
  function hasClass(el, c) { return (' ' + el.className + ' ').indexOf(' ' + c + ' ') !== -1; }
  function setClass(el, c, on) {
    var has = hasClass(el, c);
    if (on && !has) el.className = (el.className + ' ' + c).replace(/^\s+/, '');
    if (!on && has) el.className = (' ' + el.className + ' ').replace(' ' + c + ' ', ' ').replace(/^\s+|\s+$/g, '');
  }

  // Every request gives up after REQUEST_TIMEOUT_MS. Without this, requests left hanging by a
  // Wi-Fi drop use up the few connections an old browser allows and the page freezes.
  var REQUEST_TIMEOUT_MS = 5000;
  function request(method, url, done) {
    var xhr = new XMLHttpRequest();
    var finished = false;
    function finish(status, text) {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      var data = null;
      try { data = JSON.parse(text); } catch (e) {}
      done(status, data);
    }
    var timer = setTimeout(function () {
      try { xhr.abort(); } catch (e) {}
      finish(0, '');
    }, REQUEST_TIMEOUT_MS);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) finish(xhr.status, xhr.responseText);
    };
    try {
      xhr.open(method, url, true);
      if (method === 'GET') {
        xhr.setRequestHeader('Cache-Control', 'no-cache');
        xhr.setRequestHeader('Pragma', 'no-cache');
      }
      xhr.send(method === 'POST' ? '' : null);
    } catch (e) {
      finish(0, '');
    }
  }

  function formatTime(secs) {
    if (isNaN(secs) || secs <= 0) return '0:00';
    var m = Math.floor(secs / 60), s = Math.floor(secs % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function clamp(v) { return duration > 0 ? Math.max(0, Math.min(v, duration)) : 0; }
  function elapsedNow() {
    return clamp(baseElapsed + (state.playing && !state.paused ? (now() - baseTime) / 1000 : 0));
  }

  function setupMarquee(prefix, text) {
    var wrap = $(prefix + '-wrap');
    setText($(prefix), text || '');
    setText($(prefix + '-clone'), text || '');
    setClass(wrap, 'is-long', false);
    void wrap.offsetWidth; // restart the animation
    var textWidth = $(prefix).offsetWidth;
    if (textWidth > wrap.parentNode.clientWidth) {
      var secs = Math.max(6, (textWidth + 60) / 30) + 's';
      wrap.style.webkitAnimationDuration = secs;
      wrap.style.animationDuration = secs;
      setClass(wrap, 'is-long', true);
    }
  }

  function updateMarquees(title, artist, album) {
    var sig = title + '|' + artist + '|' + album;
    if (sig === songSignature) return;
    songSignature = sig;
    raf(function () {
      setupMarquee('title', title);
      setupMarquee('artist', artist);
      setupMarquee('album', album);
    });
  }

  function updateArtwork(url) {
    if (url === currentArtwork) return;
    currentArtwork = url;
    var box = $('art-container');
    while (box.firstChild) box.removeChild(box.firstChild);
    if (url) {
      var img = document.createElement('img');
      img.alt = 'Album art';
      img.src = url;
      box.appendChild(img);
      $('card-bg').style.backgroundImage = 'url("' + url + '")';
      setClass(document.querySelector('.card'), 'idle', false);
    } else {
      var ph = document.createElement('span');
      ph.className = 'art-placeholder';
      ph.innerHTML = '&#127925;';
      box.appendChild(ph);
      $('card-bg').style.backgroundImage = ''; // let the .idle gradient show
      setClass(document.querySelector('.card'), 'idle', true);
    }
  }

  function updateProgress(s) {
    var newDuration = Number(s.duration) || 0;
    var reported = Number(s.position) || 0;
    var estimate = elapsedNow();
    var trackChanged = newDuration !== duration;
    duration = newDuration;
    // Like the Pear remote: only resync the running clock when it has drifted noticeably.
    if (trackChanged || s.paused || state.paused || Math.abs(estimate - reported) > 3) {
      baseElapsed = reported;
      baseTime = now();
    } else {
      baseElapsed = estimate;
      baseTime = now();
    }
    setText($('time-duration'), formatTime(duration));
  }

  function renderControls() {
    var s = state;
    var canControl = !!(s.playing && s.can_control);
    $('btn-prev').disabled = !canControl;
    $('btn-next').disabled = !canControl;
    $('btn-playpause').disabled = !canControl;
    $('btn-shuffle').disabled = !(s.playing && s.can_shuffle);
    $('btn-repeat').disabled = !(s.playing && s.can_repeat);

    setText($('btn-playpause'), !s.playing ? '\u23EF' : (s.paused ? PLAY_GLYPH : PAUSE_GLYPH));
    setClass($('btn-shuffle'), 'active', !!(s.playing && s.shuffle));
    var repeat = s.playing ? (s.repeat || 'RepeatNone') : 'RepeatNone';
    setClass($('btn-repeat'), 'active-all', repeat === 'RepeatAll');
    setClass($('btn-repeat'), 'active-one', repeat === 'RepeatOne');

    // Players that don't take remote commands get no buttons at all, just now-playing info.
    // Players like cliamp never report position or pause, so a timer would just be a guess.
    setClass($('progress-panel'), 'hidden', !!(s.playing && s.reports_progress === false));

    var noControls = !!(s.playing && !s.can_control);
    setClass($('minimal-controls'), 'hidden', noControls);
    setClass(document.querySelector ? document.querySelector('.card') : document.getElementsByTagName('div')[0], 'no-controls', noControls);
    showNote(s.error || '');
  }

  function showNote(text) {
    setText($('status-note'), text);
    setClass($('status-note'), 'hidden', !text);
  }

  function render(s) {
    if (s.playing) {
      updateMarquees(s.title || 'Untitled', s.artist || '', s.album || EMPTY_ALBUM_TEXT);
      updateArtwork(s.art || '');
      updateProgress(s);
    } else {
      updateMarquees('Jellyfin', s.error ? "Can't reach Jellyfin" : 'Nothing playing', EMPTY_ALBUM_TEXT);
      updateArtwork('');
      duration = 0; baseElapsed = 0;
      setText($('time-duration'), '0:00');
    }
    state = s;
    renderControls();
    applyMode();
    fitArt();
  }

  /* ---- News view, switched with the Music / News tabs ---- */
  var newsData = null, newsIndex = 0, newsOffset = 0, newsShown = 0, newsFetchedAt = -1e12, newsInFlight = false, lastRotate = now();
  var card = document.querySelector('.card');
  var viewMode = 'music';
  try { if (window.localStorage && localStorage.getItem('view') === 'news') viewMode = 'news'; } catch (e) {}

  function hasNews() {
    return !!(newsData && newsData.categories && newsData.categories.length);
  }
  function inNewsMode() { return viewMode === 'news'; }

  function timeAgo(ts) {
    if (!ts) return '';
    var mins = Math.floor((new Date().getTime() / 1000 - ts) / 60);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    return Math.floor(hours / 24) + 'd ago';
  }

  function renderNewsMessage(text) {
    setText($('news-cat'), 'News');
    var dots = $('news-dots'), list = $('news-list');
    while (dots.firstChild) dots.removeChild(dots.firstChild);
    while (list.firstChild) list.removeChild(list.firstChild);
    var li = document.createElement('li');
    var msg = document.createElement('div');
    msg.className = 'news-meta';
    setText(msg, text);
    li.appendChild(msg);
    list.appendChild(li);
  }

  function renderNews() {
    if (!hasNews()) {
      renderNewsMessage(newsData ? "Couldn't load headlines. Retrying..." : 'Loading headlines...');
      return;
    }
    var cats = newsData.categories;
    if (newsIndex >= cats.length) { newsIndex = 0; newsOffset = 0; }
    var cat = cats[newsIndex];
    if (newsOffset >= cat.items.length) newsOffset = 0;
    setText($('news-cat'), cat.name);

    var dots = $('news-dots');
    while (dots.firstChild) dots.removeChild(dots.firstChild);
    for (var d = 0; d < cats.length; d++) {
      var dot = document.createElement('span');
      if (d === newsIndex) dot.className = 'on';
      dots.appendChild(dot);
    }

    var list = $('news-list');
    while (list.firstChild) list.removeChild(list.firstChild);
    for (var i = newsOffset; i < Math.min(newsOffset + MAX_HEADLINES, cat.items.length); i++) {
      var item = cat.items[i];
      var li = document.createElement('li');
      var title = document.createElement('div');
      title.className = 'news-title';
      setText(title, item.title);
      var meta = document.createElement('div');
      meta.className = 'news-meta';
      var ago = timeAgo(item.published);
      setText(meta, item.source + (ago ? ', ' + ago : ''));
      li.appendChild(title);
      li.appendChild(meta);
      list.appendChild(li);
    }

    // Drop headlines that don't fit completely, so nothing is cut off and nothing scrolls.
    var bottom = $('news').getBoundingClientRect().bottom;
    while (list.childNodes.length > 1 &&
           list.lastChild.getBoundingClientRect().bottom > bottom + 1) {
      list.removeChild(list.lastChild);
    }
    // A single headline too long to fit even on its own: shrink its text a step at a time.
    var only = list.childNodes.length === 1 ? list.firstChild : null;
    if (only) {
      var titleEl = only.firstChild;
      var base = parseFloat(window.getComputedStyle ? getComputedStyle(titleEl).fontSize : 0) || 0;
      for (var scale = 0.9; base && scale >= 0.55 &&
           only.getBoundingClientRect().bottom > bottom + 1; scale -= 0.05) {
        titleEl.style.fontSize = Math.floor(base * scale) + 'px';
      }
    }
    newsShown = list.childNodes.length;
  }

  // Next headlines in this category, or the start of the next category.
  function advanceNews() {
    if (!hasNews()) return;
    var cat = newsData.categories[newsIndex] || { items: [] };
    newsOffset += Math.max(1, newsShown);
    if (newsOffset >= cat.items.length) { newsOffset = 0; newsIndex++; }
    lastRotate = now();
    renderNews();
  }


  // The card is a fixed, full-screen height, so size the album art to whatever
  // space the text, progress bar and buttons leave over (it stays square).
  function px(style, prop) { var v = parseFloat(style[prop]); return isNaN(v) ? 0 : v; }
  function fitArt() {
    if (inNewsMode() || !window.getComputedStyle) return;
    var box = $('art-container');
    var cs = getComputedStyle(card);
    var innerH = card.clientHeight - px(cs, 'paddingTop') - px(cs, 'paddingBottom');
    var innerW = card.clientWidth - px(cs, 'paddingLeft') - px(cs, 'paddingRight');
    var used = px(getComputedStyle(box), 'marginBottom');
    var kids = card.children;
    for (var k = 0; k < kids.length; k++) {
      var el = kids[k];
      if (el === box || el.id === 'card-bg' || !el.offsetHeight) continue;
      var st = getComputedStyle(el);
      if (st.position === 'absolute') continue;
      // The controls' top margin is "auto" (it soaks up free space), so don't count it.
      used += el.offsetHeight + px(st, 'marginBottom') + (el.id === 'minimal-controls' ? 10 : px(st, 'marginTop'));
    }
    var room = innerH - used - 6;
    var size = Math.max(96, Math.floor(Math.min(innerW, room)));
    box.style.maxWidth = 'none'; // the small-screen stylesheet caps it at 78vw
    box.style.width = size + 'px';
    // If the art is already as wide as the card, split the spare height above the
    // art and above the buttons instead of leaving one big gap.
    box.style.marginTop = Math.max(0, Math.floor((room - size) / 2)) + 'px';
  }

  window.onresize = function () {
    if (inNewsMode()) { if (hasNews()) renderNews(); } else fitArt();
  };

  function applyMode() {
    var news = inNewsMode();
    if (news && !hasNews()) maybeFetchNews(); // first open: don't wait for the timer
    setClass(card, 'news-mode', news);
    setClass($('news'), 'hidden', !news);
    if (news) renderNews();
  }

  function fetchNews() {
    if (newsInFlight) return;
    newsInFlight = true;
    request('GET', '/api/news?_=' + new Date().getTime(), function (status, data) {
      newsInFlight = false;
      newsFetchedAt = now();
      if (status === 200 && data) {
        // Keep the last good headlines if a refresh comes back empty.
        if ((data.categories && data.categories.length) || !hasNews()) newsData = data;
        if (inNewsMode()) renderNews();
      }
    });
  }

  function maybeFetchNews() {
    if (!inNewsMode()) return; // only fetch while the News tab is open
    var loading = !hasNews();
    // Every minute normally; every few seconds while the Mac mini is still fetching the first batch.
    if (now() - newsFetchedAt > (loading ? 4000 : 60000)) fetchNews();
  }

  function rotateNews() {
    if (!inNewsMode() || now() - lastRotate < NEWS_ROTATE_MS) return;
    advanceNews();
  }

  function setView(mode) {
    viewMode = mode;
    try { if (window.localStorage) localStorage.setItem('view', mode); } catch (e) {}
    var tabs = $('view-tabs').getElementsByTagName('button');
    for (var t = 0; t < tabs.length; t++) setClass(tabs[t], 'on', tabs[t].getAttribute('data-view') === mode);
    lastRotate = now();
    songSignature = ''; // re-measure the scrolling titles when the music view comes back
    applyMode();
    if (mode === 'music') fitArt();
    if (mode === 'music') updateMarquees(state.playing ? (state.title || 'Untitled') : 'Jellyfin',
      state.playing ? (state.artist || '') : (state.error ? "Can't reach Jellyfin" : 'Nothing playing'),
      state.playing ? (state.album || EMPTY_ALBUM_TEXT) : EMPTY_ALBUM_TEXT);
  }

  var tabButtons = $('view-tabs').getElementsByTagName('button');
  for (var tb = 0; tb < tabButtons.length; tb++) {
    tabButtons[tb].onclick = (function (mode) {
      return function () { setView(mode); };
    })(tabButtons[tb].getAttribute('data-view'));
  }
  if (viewMode === 'news') setView('news');

  $('news').onclick = advanceNews;

  var pollInFlight = false;
  function updateStatus() {
    if (pollInFlight) return; // never stack polls on top of a slow one
    pollInFlight = true;
    // The timestamp stops old Android browsers from reusing a cached answer.
    request('GET', '/api/state?_=' + new Date().getTime(), function (status, data) {
      pollInFlight = false;
      // Right after a button press, skip one stale poll so the button doesn't flicker back.
      if (now() < pendingUntil) return;
      if (status === 200 && data) render(data);
      else render({ playing: false, error: 'Lost connection to the remote server. Retrying...' });
    });
  }

  function sendControl(action) {
    if (isSending) return;
    isSending = true;
    // Show the result immediately; the next poll confirms it.
    var optimistic = {};
    for (var k in state) optimistic[k] = state[k];
    if (action === 'playpause') optimistic.paused = !state.paused;
    if (action === 'shuffle') optimistic.shuffle = !state.shuffle;
    if (action === 'repeat') optimistic.repeat = REPEAT_NEXT[state.repeat || 'RepeatNone'];
    if (action === 'playpause' || action === 'shuffle' || action === 'repeat') {
      if (action === 'playpause') { baseElapsed = elapsedNow(); baseTime = now(); }
      state = optimistic;
      renderControls();
    }
    pendingUntil = now() + 600;
    request('POST', '/api/control/' + action, function (status, data) {
      isSending = false;
      if (status !== 200) showNote((data && data.error) || "That didn't work.");
      setTimeout(function () { pendingUntil = 0; updateStatus(); }, 250);
    });
  }

  function animateProgress() {
    if (state.playing && duration > 0) {
      var e = elapsedNow();
      setText($('time-elapsed'), formatTime(e));
      $('track-fill').style.width = (e / duration * 100) + '%';
    } else {
      setText($('time-elapsed'), '0:00');
      $('track-fill').style.width = '0%';
    }
    raf(animateProgress);
  }

  var buttons = $('minimal-controls').getElementsByTagName('button');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = (function (action) {
      return function () { if (!this.disabled) sendControl(action); };
    })(buttons[i].getAttribute('data-action'));
  }

  updateStatus();
  setInterval(updateStatus, POLL_INTERVAL_MS);
  setInterval(maybeFetchNews, 2000);
  setInterval(rotateNews, 1000);
  raf(animateProgress);
})();
</script>
</body>
</html>
